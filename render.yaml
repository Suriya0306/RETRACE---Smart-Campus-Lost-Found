services:
  - type: web
    name: call-analytics-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m gunicorn wsgi:app --workers 4 --worker-class sync --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: 0
